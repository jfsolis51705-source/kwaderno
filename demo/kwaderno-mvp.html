/* On a tablet or computer, show the app inside a phone-shaped screen. Fixed bars (bottom tabs,
   cart button, toast) pin to the phone because #phone is transformed and does not scroll. */
@media (min-width: 520px) { /* desktop preview only: JS sets .framed */
  :root[data-layout="phone"].framed, :root[data-layout="phone"].framed body { height: 100%; }
  :root[data-layout="phone"].framed body { margin: 0; overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 70%); }
  :root[data-layout="phone"].framed body::before { display: none; }

    border: 11px solid #121619; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 2px #3a4248, 0 30px 70px rgb(0 0 0 / .35); }

  :root[data-layout="phone"].framed #screen::-webkit-scrollbar { display: none; }
  :root[data-layout="phone"].framed #phone::after { content: ""; position: absolute; top: 8px; left: 50%; width: 92px; height: 24px; margin-left: -46px; border-radius: 99px; background: #121619; z-index: 40; pointer-events: none; }
  :root[data-layout="phone"].framed #phone header.top .wrap { padding-top: 38px; }

}
/* Landscape (JS sets .landscape on real phones and tablets held sideways, and on the tablet view). */

/* Desktop: use the width of a big monitor — wider page, more product tiles, a roomier current-sale panel. */

:root[data-layout="desktop"] .tiles { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }

/* Touch-screen monitors and tablets: finger-sized targets everywhere, hover effects not needed to see anything. */
@media (any-pointer: coarse) {
  .btn { min-height: 44px; }
  .btn.sm { min-height: 38px; padding-inline: 12px; }
  nav.tabs a { padding: 12px 16px; }

/* Desktop preview of a tablet (upright 3:4 or sideways 4:3) inside a bezel; the rail and buttons stay inside the frame. */
@media (min-width: 520px) {
  :root.framed-tab, :root.framed-tab body { height: 100%; }
  :root.framed-tab body { margin: 0; overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 70%); }
  :root.framed-tab body::before { display: none; }
  :root.framed-tab #phone { position: relative; transform: translateZ(0); margin-left: 0; min-height: 0; background: var(--bg); border: 14px solid #121619; border-radius: 30px; overflow: hidden; box-shadow: 0 0 0 2px #3a4248, 0 30px 70px rgb(0 0 0 / .35);
    /* a real tablet's size (iPad-like), scaled as a whole to fit the window, so the layout inside is never squeezed */
    flex: none; width: 820px; height: 1100px; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--tabk, 1)); transform-origin: center; }
  :root.framed-tab.framed-tab-land #phone { width: 1180px; height: 820px; }
  :root.framed-tab #screen { height: 100%; margin-left: var(--rail, 96px); overflow-y: auto; overscroll-behavior: contain; }
  /* the frame's transform makes the rail, + button, pop-ups and lock screen (all position: fixed) sit inside the tablet */
  :root.framed-tab .layout-toggle { right: 16px; bottom: 16px; }

        h("div", { class: "pills", style: "margin:8px 0" }, h("a", { class: "btn sm primary", href: `https://www.google.com/maps/d/viewer?mid=${MYMAP_ID}`, target: "_blank", rel: "noopener noreferrer" }, "Open live map in Google Maps ↗"), h("a", { class: "btn sm", href: "#admin-audit", onclick: (e) => { e.preventDefault(); go("admin", "audit"); } }, "Map + coverage in Shelf audit")),
        pins.length ? [
          h("div", { class: "grid kpis", style: "margin:10px 0" },
            kpi("Surveyed", String(pins.length)), kpi("Signed in survey", String(pins.filter((p) => p.signed).length)), kpi("Retained in survey", String(pins.filter((p) => p.retention === "retain").length)), kpi("Merchants on KWADERNO", String(realStores))),
          h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Survey area", "Stores", "Signed", "Retained"].map((x, i) => h("th", { class: i ? "r" : "", text: x })))),
            h("tbody", {}, byArea.map((r) => h("tr", {}, h("td", { text: r.a }), h("td", { class: "r num", text: r.n }), h("td", { class: "r num", text: r.signed }), h("td", { class: "r num", text: r.retained })))))),
          h("div", { class: "legend", style: "margin:14px 0 8px" }, h("span", {}, h("i", { style: "background:var(--s1)" }), "Signed in survey"), h("span", {}, h("i", { style: "background:var(--s2)" }), "Surveyed, not signed")),
          h("div", { class: "plots" }, areas.map((a) => locationPlot(a, pins.filter((p) => p.area === a)))),
          h("p", { class: "muted small", style: "margin:10px 0 0", text: "Positions are plotted from the survey GPS (north is up). Tap a dot for the store. Owner names and phone numbers are not stored in this app." }),

  }

  function salesChart(days) {
    const W = 720, H = 220, pl = 56, pr = 8, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
    const max = Math.max(1, ...days.map((d) => d.total));
    const raw = max / 3, mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))), m = raw / mag;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * mag, top = Math.ceil(max / step) * step;
    const band = iw / days.length, bw = Math.min(24, band - 2), y = (v) => pt + ih - (v / top) * ih;
    const NS = "http://www.w3.org/2000/svg";
    const el = (t, a) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Bar chart of daily sales for the last 30 days" });
    const short = (d) => d.toLocaleDateString("en-PH", { month: "short", day: "numeric" });
    const compact = (c) => { const v = c / 100; return v >= 1000 ? "₱" + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : "₱" + Math.round(v); };
    for (let i = 0; i * step <= top; i++) {
      const v = i * step;
      svg.append(el("line", { x1: pl, x2: W - pr, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
      const t = el("text", { x: pl - 8, y: y(v), dy: "0.32em", "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }); t.textContent = compact(v); svg.append(t);
    }
    const wrap = h("div", { class: "chart" }); const tip = h("div", { class: "tip", hidden: true });
    days.forEach((d, i) => {
      const x = pl + i * band + (band - bw) / 2, yy = y(d.total), hh = pt + ih - yy, r = Math.min(4, hh);
      if (hh > 0) svg.append(el("path", { d: `M${x},${pt + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${pt + ih} Z`, fill: "var(--accent)" }));
      const hit = el("rect", { x: pl + i * band, y: pt, width: band, height: ih, fill: "transparent", tabindex: 0, "aria-label": `${short(d.d)}: ${peso(d.total)}, ${d.n} sales` });
      const show = () => { tip.hidden = false; tip.replaceChildren(h("b", { text: d.d.toLocaleDateString("en-PH", { weekday: "short", month: "short", day: "numeric" }) }), h("div", { class: "num", text: `${peso(d.total)} · ${d.n} sale(s)` })); tip.style.left = `clamp(0px, calc(${((pl + i * band + band / 2) / W) * 100}% - 70px), calc(100% - 160px))`; };
      for (const ev of ["mouseenter", "focus", "click"]) hit.addEventListener(ev, show);
      for (const ev of ["mouseleave", "blur"]) hit.addEventListener(ev, () => (tip.hidden = true));
      svg.append(hit);
      if ((i % 7 === 0 && days.length - 1 - i >= 4) || i === days.length - 1) { const t = el("text", { x: pl + i * band + band / 2, y: H - 8, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }); t.textContent = short(d.d); svg.append(t); }
    });
    svg.append(el("line", { x1: pl, x2: W - pr, y1: pt + ih, y2: pt + ih, stroke: "var(--muted)", "stroke-opacity": .5, "stroke-width": 1 }));
    const table = h("table", { class: "sr" }, h("caption", { text: "Daily sales, last 30 days" }), h("tbody", {}, days.map((d) => h("tr", {}, h("td", { text: d.key }), h("td", { text: peso(d.total) }), h("td", { text: d.n })))));
    wrap.append(svg, tip, table);
    return wrap;
  }

  function locationPlot(area, ps) {
    const W = 300, H = 220, pad = 14;
    const lats = ps.map((p) => p.lat), lngs = ps.map((p) => p.lng);
    let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const midLat = (minLat + maxLat) / 2, kx = Math.cos((midLat * Math.PI) / 180);
    const spanX = Math.max((maxLng - minLng) * kx, 0.002), spanY = Math.max(maxLat - minLat, 0.002);
    const sc = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    const ox = (W - spanX * sc) / 2, oy = (H - spanY * sc) / 2;
    const px = (lng) => ox + (lng - minLng) * kx * sc, py = (lat) => H - oy - (lat - minLat) * sc;
    const NS = "http://www.w3.org/2000/svg";
    const el = (t, a) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Location plot of ${ps.length} surveyed stores in ${area}` });
    svg.append(el("rect", { x: 0, y: 0, width: W, height: H, rx: 8, fill: "var(--surface)" }));
    const km = (spanX / kx) * 111 * Math.cos((midLat * Math.PI) / 180);
    const info = h("div", { class: "muted small", style: "min-height:2.6em;margin-top:6px", text: "Tap a dot" });
    for (const p of [...ps].sort((a, b) => Number(a.signed) - Number(b.signed))) {
      const c = el("circle", { cx: px(p.lng), cy: py(p.lat), r: 5.5, fill: p.signed ? "var(--s1)" : "var(--s2)", stroke: "var(--surface)", "stroke-width": 2, tabindex: 0, style: "cursor:pointer" });
      const t = el("title", {}); t.textContent = p.name; c.append(t);
      const show = () => { info.replaceChildren(`${p.name} · ${[p.barangay, p.city].filter(Boolean).join(", ") || area}${p.signed ? " · signed" : ""}${p.retention ? " · " + p.retention : ""}${p.surveyedOn ? " · surveyed " + p.surveyedOn : ""} · `, gmapLink(p.lat, p.lng)); };
      c.addEventListener("click", show); c.addEventListener("focus", show);
      svg.append(c);
    }
    return h("div", { class: "plot" }, h("div", { style: "display:flex;justify-content:space-between;gap:8px" }, h("b", { text: area }), h("span", { class: "muted small", text: `${ps.length} stores · ~${km < 1 ? "<1" : km.toFixed(1)} km wide` })), svg, info);
  }

  // edit route lives under products
  const _viewProducts = viewProducts;
  viewProducts = function () { if (sub && sub.startsWith("edit-")) { const p = productById(sub.slice(5)); if (p) return productForm(p); } return _viewProducts(); };
