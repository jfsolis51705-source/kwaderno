.chip.low { background: var(--warn-soft); color: var(--warn); } .chip.out { background: var(--bad-soft); color: var(--bad); } .chip.ok { background: var(--accent-soft); color: var(--accent); }

}

<script>
(() => {
  "use strict";
  // ---------- tiny helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const peso = (c) => "₱" + ((c || 0) / 100).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const qtyFmt = (q) => (Number.isInteger(q) ? q : Math.round(q * 1000) / 1000).toLocaleString("en-PH");
  const toCentavos = (s) => { const t = String(s ?? "").replace(/[₱,\s]/g, ""); return /^\d+(\.\d{0,2})?$/.test(t) ? Math.round(Number(t) * 100) : null; };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const dayKey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const todayKey = () => dayKey(new Date().toISOString());
  const when = (iso) => new Date(iso).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  let toastT;
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); };

  // ---------- state ----------
  // Append-only model: stock = Σ moves − Σ sold (non-voided); utang = Σ credit sales − Σ payments.
  const S = { db: null, me: null, ready: false, error: null, products: [], moves: [], sales: [], customers: [], payments: [], store: { name: "My sari-sari store" } };
  const cart = { lines: [], method: "cash", tendered: "", ref: "", discount: "", customerId: "" };
  let view = "home", sub = null, productFilter = "all", search = "";
  const VIEWS = [
    ["home", "Home", "M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],
    ["sell", "Sell", "M3 4h2l2 12h11l2-8H7M9 20a1 1 0 1 0 0 .1M17 20a1 1 0 1 0 0 .1"],
    ["products", "Stock", "M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"],
    ["utang", "Utang", "M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0"],
    ["reports", "Reports", "M4 20V10M10 20V4M16 20v-7M22 20H2"],
  ];

  const derived = () => {
    const stock = new Map(), sold = new Map(), balance = new Map();
    for (const m of S.moves) stock.set(m.productId, (stock.get(m.productId) || 0) + Number(m.qty || 0));
    for (const s of S.sales) {
      if (s.voided) continue;
      for (const l of s.lines || []) { stock.set(l.productId, (stock.get(l.productId) || 0) - Number(l.qty || 0)); sold.set(l.productId, (sold.get(l.productId) || 0) + Number(l.qty || 0)); }
      if (s.method === "credit" && s.customerId) balance.set(s.customerId, (balance.get(s.customerId) || 0) + s.total);
    }
    for (const p of S.payments) balance.set(p.customerId, (balance.get(p.customerId) || 0) - p.amount);
    return { stock, sold, balance };
  };
  let D = derived();
  const productById = (id) => S.products.find((p) => p.id === id);
  const activeProducts = () => S.products.filter((p) => !p.archived).sort((a, b) => a.name.localeCompare(b.name));
  const stockOf = (id) => Math.round((D.stock.get(id) || 0) * 1000) / 1000;

  // ---------- data ----------
  const col = (name) => S.db.collection(name);
  async function write(path, body) {
    if (!S.db) throw new Error("Not connected");
    await S.db.doc(path).set(body);
  }
  async function boot() {
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch { /* handled below */ }
    if (!db) { S.error = "nodb"; S.ready = true; render(); return; }
    S.db = db;
    try { S.me = user ? await user.id() : null; } catch { S.me = null; }
    const timer = setTimeout(() => { if (!S.ready) { S.error = "slow"; render(); } }, 10000);
    let pending = new Set(["products", "moves", "sales", "customers", "payments"]);
    const done = (k) => { pending.delete(k); if (!pending.size) { S.ready = true; clearTimeout(timer); if (S.error === "slow") S.error = null; } };
    for (const k of ["products", "moves", "sales", "customers", "payments"]) {
      col(k).onSnapshot((snap) => {
        S[k] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        D = derived();
        if (!snap.metadata.fromCache) done(k);
        render();
      }, (e) => { S.error = e.code; S.ready = true; clearTimeout(timer); render(); });
    }
    db.doc("store/profile").onSnapshot((d) => { if (d.exists) S.store = { ...S.store, ...d.data() }; render(); }, () => {});
  }

  // ---------- routing ----------
  function go(v, s = null) { view = v; sub = s; location.hash = s ? `${v}-${s}` : v; render(); window.scrollTo(0, 0); }
  function readHash() {
    const raw = location.hash.slice(1);
    const v = VIEWS.find(([k]) => raw === k || raw.startsWith(k + "-"));
    view = v ? v[0] : "home";
    sub = v && raw.length > v[0].length ? raw.slice(v[0].length + 1) : null;
  }
  window.addEventListener("hashchange", () => { readHash(); render(); });

  // ---------- dialog ----------
  const dlg = $("#dlg");
  dlg.addEventListener("click", (e) => { if (e.target === dlg || e.target.closest("[data-close]")) dlg.close(); });
  function openDialog(title, body) { $("#dlgTitle").textContent = title; const b = $("#dlgBody"); b.replaceChildren(body); dlg.showModal(); }

  // ---------- shell ----------
  function navLinks(container, withIcons) {
    container.replaceChildren(...VIEWS.map(([k, label, d]) => h("a", { href: "#" + k, "aria-current": view === k ? "page" : null, onclick: (e) => { e.preventDefault(); go(k); } },
      withIcons ? svgIcon(d) : null, label)));
  }
  function svgIcon(d) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.8"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); s.append(p); return s;
  }

  function render() {
    $("#storeName").textContent = S.store.name;
    navLinks($("#tabs"), false); navLinks($("#bottom"), true);
    const app = $("#app");
    if (S.error === "nodb") return app.replaceChildren(h("div", { class: "card" }, h("h2", { text: "Sign in to use the store" }), h("p", { class: "muted", text: "This app saves your store's products, sales and utang online. Open it on claude.ai while signed in (as the owner, or as someone it was shared with as Contributor or Editor)." })));
    if (!S.ready) return app.replaceChildren(h("div", { class: "empty", text: S.error === "slow" ? "Still connecting… check your internet connection." : "Loading your store…" }));
    if (S.error && S.error !== "slow") app.prepend?.(h("div", { class: "note err", text: "Some data could not load (" + S.error + "). Reload the page to try again." }));
    const fns = { home: viewHome, sell: viewSell, products: viewProducts, utang: viewUtang, reports: viewReports };
    app.replaceChildren(fns[view]());
  }

  // ---------- HOME ----------
  function viewHome() {
    const t = todayKey();
    const today = S.sales.filter((s) => !s.voided && dayKey(s.at) === t);
    const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
    const by = (m) => sum(today.filter((s) => s.method === m), (s) => s.total);
    const prods = activeProducts();
    const value = sum(prods, (p) => Math.max(0, stockOf(p.id)) * (p.cost || 0));
    const low = prods.filter((p) => stockOf(p.id) <= (p.reorder || 0)).sort((a, b) => stockOf(a.id) - (a.reorder || 0) - (stockOf(b.id) - (b.reorder || 0)));
    const owed = [...D.balance.values()].filter((v) => v > 0);
    const recent = [...S.sales].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 6);
    const kpi = (label, value, hint, onclick) => h(onclick ? "button" : "div", { class: "card kpi", style: onclick ? "text-align:left" : null, onclick }, h("div", { class: "label", text: label }), h("div", { class: "value num", text: value }), hint ? h("div", { class: "muted small", text: hint }) : null);
