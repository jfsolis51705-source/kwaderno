<script>
(() => {
  "use strict";
  // ---------- tiny helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const peso = (c) => "₱" + ((c || 0) / 100).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function adminStore(x, k30) {

  function salesChart(days) {
    const W = 720, H = 220, pl = 56, pr = 8, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
    const max = Math.max(1, ...days.map((d) => d.total));
    const raw = max / 3, mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))), m = raw / mag;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * mag, top = Math.ceil(max / step) * step;
    const band = iw / days.length, bw = Math.min(24, band - 2), y = (v) => pt + ih - (v / top) * ih;
    const NS = "http://www.w3.org/2000/svg";
    const el = (t, a) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Bar chart of daily sales for the last 30 days" });
    const short = (d) => d.toLocaleDateString("en-PH", { month: "short", day: "numeric" });
    const compact = (c) => { const v = c / 100; return v >= 1000 ? "₱" + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : "₱" + Math.round(v); };
    for (let i = 0; i * step <= top; i++) {
      const v = i * step;
      svg.append(el("line", { x1: pl, x2: W - pr, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
      const t = el("text", { x: pl - 8, y: y(v), dy: "0.32em", "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }); t.textContent = compact(v); svg.append(t);
    }
    const wrap = h("div", { class: "chart" }); const tip = h("div", { class: "tip", hidden: true });
    days.forEach((d, i) => {
      const x = pl + i * band + (band - bw) / 2, yy = y(d.total), hh = pt + ih - yy, r = Math.min(4, hh);
      if (hh > 0) svg.append(el("path", { d: `M${x},${pt + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${pt + ih} Z`, fill: "var(--accent)" }));
      const hit = el("rect", { x: pl + i * band, y: pt, width: band, height: ih, fill: "transparent", tabindex: 0, "aria-label": `${short(d.d)}: ${peso(d.total)}, ${d.n} sales` });
      const show = () => { tip.hidden = false; tip.replaceChildren(h("b", { text: d.d.toLocaleDateString("en-PH", { weekday: "short", month: "short", day: "numeric" }) }), h("div", { class: "num", text: `${peso(d.total)} · ${d.n} sale(s)` })); tip.style.left = `clamp(0px, calc(${((pl + i * band + band / 2) / W) * 100}% - 70px), calc(100% - 160px))`; };
      for (const ev of ["mouseenter", "focus", "click"]) hit.addEventListener(ev, show);
      for (const ev of ["mouseleave", "blur"]) hit.addEventListener(ev, () => (tip.hidden = true));
      svg.append(hit);
      if ((i % 7 === 0 && days.length - 1 - i >= 4) || i === days.length - 1) { const t = el("text", { x: pl + i * band + band / 2, y: H - 8, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }); t.textContent = short(d.d); svg.append(t); }
    });
    svg.append(el("line", { x1: pl, x2: W - pr, y1: pt + ih, y2: pt + ih, stroke: "var(--muted)", "stroke-opacity": .5, "stroke-width": 1 }));
    const table = h("table", { class: "sr" }, h("caption", { text: "Daily sales, last 30 days" }), h("tbody", {}, days.map((d) => h("tr", {}, h("td", { text: d.key }), h("td", { text: peso(d.total) }), h("td", { text: d.n })))));
    wrap.append(svg, tip, table);
    return wrap;
  }

  function locationPlot(area, ps) {
    const W = 300, H = 220, pad = 14;
    const lats = ps.map((p) => p.lat), lngs = ps.map((p) => p.lng);
    let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const midLat = (minLat + maxLat) / 2, kx = Math.cos((midLat * Math.PI) / 180);
    const spanX = Math.max((maxLng - minLng) * kx, 0.002), spanY = Math.max(maxLat - minLat, 0.002);
    const sc = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    const ox = (W - spanX * sc) / 2, oy = (H - spanY * sc) / 2;
    const px = (lng) => ox + (lng - minLng) * kx * sc, py = (lat) => H - oy - (lat - minLat) * sc;
    const NS = "http://www.w3.org/2000/svg";
    const el = (t, a) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Location plot of ${ps.length} surveyed stores in ${area}` });
    svg.append(el("rect", { x: 0, y: 0, width: W, height: H, rx: 8, fill: "var(--surface)" }));
    const km = (spanX / kx) * 111 * Math.cos((midLat * Math.PI) / 180);
    const info = h("div", { class: "muted small", style: "min-height:2.6em;margin-top:6px", text: "Tap a dot" });
    for (const p of [...ps].sort((a, b) => Number(a.signed) - Number(b.signed))) {
      const c = el("circle", { cx: px(p.lng), cy: py(p.lat), r: 5.5, fill: p.signed ? "var(--s1)" : "var(--s2)", stroke: "var(--surface)", "stroke-width": 2, tabindex: 0, style: "cursor:pointer" });
      const t = el("title", {}); t.textContent = p.name; c.append(t);
      const show = () => { info.textContent = `${p.name} · ${[p.barangay, p.city].filter(Boolean).join(", ") || area}${p.signed ? " · signed" : ""}${p.retention ? " · " + p.retention : ""}${p.surveyedOn ? " · surveyed " + p.surveyedOn : ""}`; };
      c.addEventListener("click", show); c.addEventListener("focus", show);
      svg.append(c);
    }
    return h("div", { class: "plot" }, h("div", { style: "display:flex;justify-content:space-between;gap:8px" }, h("b", { text: area }), h("span", { class: "muted small", text: `${ps.length} stores · ~${km < 1 ? "<1" : km.toFixed(1)} km wide` })), svg, info);
  }
