<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KWADERNO Scan</title>
  <meta name="description" content="Scan QR codes and barcodes with your phone or computer camera.">
  <meta name="theme-color" content="#1f1f1f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KW Scan">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><h1>SCAN</h1></header>

  <main>
    <!-- ===== SCAN ===== -->
    <section id="tab-scan" class="tab" aria-labelledby="scanTitle">
      <h2 id="scanTitle" class="title">Scan the barcode or QR code</h2>
      <p class="sub">Line it up inside the red corners and keep the phone steady.</p>

      <div class="stage" id="stage">
        <div id="reader" aria-label="Camera view"></div>
        <div class="frame" id="frame" aria-hidden="true"><i></i><i></i><i></i><i></i><b class="laser"></b></div>
        <div class="stage-msg" id="stageMsg" hidden></div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span><span id="statusText">Starting camera…</span></div>

      <div class="controls">
        <label class="sel">
          <span class="sr">Camera</span>
          <select id="cameraSel" aria-label="Camera / lens"><option value="">Back camera</option></select>
        </label>
        <button class="icon" id="torchBtn" type="button" aria-pressed="false" hidden title="Flashlight">🔦<span class="sr"> Flashlight</span></button>
        <button class="icon" id="pauseBtn" type="button" title="Pause camera">⏸<span class="sr"> Pause</span></button>
      </div>
      <div class="zoom" id="zoomRow" hidden>
        <span aria-hidden="true">🔍</span>
        <input type="range" id="zoom" min="1" max="1" step="0.1" value="1" aria-label="Zoom">
      </div>

      <div class="row">
        <label class="btn file">
          <input type="file" id="fileIn" accept="image/*" hidden>
          🖼️ Scan from a photo
        </label>
        <label class="chk"><input type="checkbox" id="keepGoing"> Keep scanning</label>
      </div>

      <!-- result card -->
      <div class="result" id="result" hidden>
        <div class="res-head"><span class="badge" id="resFormat">QR</span><span class="time" id="resTime"></span></div>
        <div class="res-text" id="resText"></div>
        <div class="res-actions">
          <button class="btn primary" id="copyBtn" type="button">📋 Copy</button>
          <a class="btn" id="openBtn" hidden target="_blank" rel="noopener noreferrer">🔗 Open link</a>
          <button class="btn" id="againBtn" type="button">↻ Scan again</button>
        </div>
        <p class="warn" id="linkWarn" hidden>Check the address before opening. QR codes can point to fake sites.</p>
      </div>
    </section>

    <!-- ===== HISTORY ===== -->
    <section id="tab-history" class="tab" hidden aria-labelledby="histTitle">
      <h2 id="histTitle" class="title">History</h2>
      <div class="row">
        <input type="search" id="histSearch" placeholder="Search scans" aria-label="Search scans">
      </div>
      <div class="row">
        <button class="btn primary" id="csvBtn" type="button">⬇️ Export CSV</button>
        <button class="btn" id="clearBtn" type="button">🗑 Clear</button>
      </div>
      <p class="sub" id="histCount"></p>
      <ul class="hist" id="histList"></ul>
      <p class="sub small">Saved only on this device.</p>
    </section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="scan" aria-current="page"><span aria-hidden="true">▣</span>Scan</button>
    <button type="button" data-tab="history"><span aria-hidden="true">⟲</span>History</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="vendor/zxing-library-0.21.3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
